name: Update Username Pool (Node.js)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pool:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run pool updater
        run: node update_pool.mjs

      - name: Commit and push pool.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pool.json
          if git diff --staged --quiet; then
            echo "No changes to pool.json"
          else
            git commit -m "chore: update username pool"
            git push
          fi
