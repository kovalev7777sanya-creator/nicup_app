<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Генератор ников</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-deep: #070614;
      --bg-mid: #100d2b;
      --orb-violet: rgba(114, 86, 255, 0.36);
      --orb-gold: rgba(255, 206, 59, 0.16);
      --glass: rgba(255, 255, 255, 0.07);
      --glass-strong: rgba(255, 255, 255, 0.12);
      --recessed: rgba(6, 5, 18, 0.56);
      --border: rgba(255, 255, 255, 0.16);
      --gold-border: rgba(255, 210, 63, 0.48);
      --text: #ffffff;
      --sec: rgba(226, 224, 255, 0.68);
      --gold: #ffd23f;
      --gold-ink: #120f24;
      --green: #34d399;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      padding: 16px 14px 44px;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      color: var(--text);
      background-color: var(--bg-deep);
      background-image:
        radial-gradient(circle at 15% 8%, var(--orb-violet) 0%, transparent 46%),
        radial-gradient(circle at 88% 14%, var(--orb-gold) 0%, transparent 42%),
        linear-gradient(180deg, var(--bg-mid) 0%, var(--bg-deep) 100%);
      background-attachment: fixed;
    }

    .wrap { max-width: 520px; margin: 0 auto; }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .title { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .sub { margin: 2px 0 0; font-size: 12px; color: var(--sec); }

    .badge {
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      color: var(--gold);
      background: rgba(255, 210, 63, 0.15);
      border: 1px solid var(--gold-border);
      flex-shrink: 0;
    }

    .card {
      background: var(--glass);
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 10px 24px rgba(0, 0, 0, 0.32);
    }

    .row-opts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .select, .input {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--recessed);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      padding: 11px 12px;
      border-radius: 12px;
      outline: none;
    }

    .select:focus, .input:focus { border-color: var(--gold); }

    .btn-gold {
      width: 100%;
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.6);
      background: linear-gradient(150deg, #ffe270, var(--gold));
      color: var(--gold-ink);
      font-family: inherit;
      font-size: 15px;
      font-weight: 800;
      padding: 13px;
      border-radius: 14px;
      cursor: pointer;
    }

    .nick-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nick-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 13px;
      border-radius: 14px;
      background: var(--recessed);
      border: 1px solid var(--border);
      cursor: pointer;
    }

    .nick-item:active { border-color: var(--gold); }
    .nick-text { font-size: 15px; font-weight: 700; letter-spacing: 0.01em; word-break: break-all; }
    .nick-copy { font-size: 11px; font-weight: 700; color: var(--gold); flex-shrink: 0; }

    .toast {
      min-height: 18px;
      font-size: 12px;
      font-weight: 700;
      color: var(--green);
      margin-top: 8px;
      text-align: center;
    }

    /* Рекламный баннер из ad.json */
    .ad-banner {
      display: none;
      text-decoration: none;
      color: var(--text);
      background: linear-gradient(145deg, rgba(255, 210, 63, 0.14), rgba(114, 86, 255, 0.14));
      border: 1px solid var(--gold-border);
      border-radius: 20px;
      padding: 12px;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .ad-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .ad-tag {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--gold-ink);
      background: var(--gold);
      padding: 3px 8px;
      border-radius: 999px;
    }

    .ad-title { font-size: 15px; font-weight: 800; margin: 0 0 4px; }
    .ad-desc { font-size: 12px; color: var(--sec); margin: 0; line-height: 1.4; }
    .ad-media {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 10px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div>
        <h1 class="title">Генератор ников</h1>
        <p class="sub">Идеи для Telegram, игр и соцсетей</p>
      </div>
      <div class="badge">NICUP</div>
    </div>

    <!-- Баннер, управляемый через админ-панель (ad.json) -->
    <a id="adBanner" class="ad-banner" href="#" target="_blank" rel="noopener noreferrer">
      <div class="ad-top">
        <span class="ad-tag" id="adTag">Реклама</span>
        <span style="font-size:11px;color:var(--gold);font-weight:700;">Открыть →</span>
      </div>
      <img id="adImg" class="ad-media" alt="Баннер" />
      <video id="adVideo" class="ad-media" autoplay muted loop playsinline></video>
      <h2 class="ad-title" id="adTitle"></h2>
      <p class="ad-desc" id="adDesc"></p>
    </a>

    <div class="card">
      <div class="row-opts">
        <select id="styleSelect" class="select">
          <option value="cool">Дерзкий / Игровой</option>
          <option value="clean">Минимализм</option>
          <option value="cyber">Неон / Кибер</option>
          <option value="myth">Мифология / Темный</option>
        </select>
        <input id="seedWord" class="input" type="text" placeholder="Слово (необязательно)" maxlength="16" />
      </div>

      <button type="button" class="btn-gold" id="genBtn">Сгенерировать ники</button>
      <div class="toast" id="toast">Нажми на ник, чтобы скопировать</div>
    </div>

    <div class="card">
      <div class="nick-list" id="nickList"></div>
    </div>
  </div>

  <script>
    (function () {
      const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
      if (tg) {
        tg.ready();
        tg.expand();
      }

      const prefixes = {
        cool: ["vex", "krx", "zav", "drk", "rzn", "kray", "volt", "blitz", "grim", "onyx"],
        clean: ["mori", "lumen", "solis", "kairo", "nova", "aire", "verve", "nord", "soren", "talen"],
        cyber: ["neon", "sync", "byte", "glch", "hex", "zero", "flux", "node", "kiber", "pulse"],
        myth: ["abyss", "nyx", "kron", "valk", "moros", "draco", "ereb", "astra", "rune", "titan"]
      };

      const suffixes = {
        cool: ["x", "z", "ix", "on", "ex", "kov", "rage", "core"],
        clean: ["o", "a", "is", "en", "el", "io", "ur", "yn"],
        cyber: ["99", "0x", "bot", "net", "exe", "ai", "v2", "link"],
        myth: ["os", "is", "ar", "on", "um", "or", "ath", "ek"]
      };

      function pick(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      function cleanWord(str) {
        return (str || "").toLowerCase().replace(/[^a-zа-яё0-9]/gi, "").slice(0, 12);
      }

      function makeNick(style, word) {
        const pList = prefixes[style] || prefixes.cool;
        const sList = suffixes[style] || suffixes.cool;
        const p = pick(pList);
        const s = pick(sList);
        const num = Math.random() < 0.45 ? String(Math.floor(10 + Math.random() * 890)) : "";

        if (word) {
          const mode = Math.floor(Math.random() * 3);
          if (mode === 0) return p + "_" + word + (Math.random() < 0.4 ? num : "");
          if (mode === 1) return word + "_" + s + (Math.random() < 0.4 ? num : "");
          return word + s;
        }

        const sep = Math.random() < 0.35 ? "_" : "";
        return p + sep + s + num;
      }

      const nickListEl = document.getElementById("nickList");
      const toastEl = document.getElementById("toast");

      function showToast(msg) {
        toastEl.textContent = msg;
        clearTimeout(showToast._t);
        showToast._t = setTimeout(function () {
          toastEl.textContent = "Нажми на ник, чтобы скопировать";
        }, 1800);
      }

      function renderNicks() {
        const style = document.getElementById("styleSelect").value;
        const word = cleanWord(document.getElementById("seedWord").value);
        nickListEl.innerHTML = "";

        for (let i = 0; i < 8; i++) {
          const nick = makeNick(style, word);
          const item = document.createElement("div");
          item.className = "nick-item";
          item.innerHTML = '<span class="nick-text"></span><span class="nick-copy">Копировать</span>';
          item.querySelector(".nick-text").textContent = nick;

          item.addEventListener("click", async function () {
            try {
              if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(nick);
              } else {
                const ta = document.createElement("textarea");
                ta.value = nick;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand("copy");
                document.body.removeChild(ta);
              }
              showToast("Скопировано: " + nick);
            } catch (_) {
              showToast("Ник: " + nick);
            }
          });

          nickListEl.appendChild(item);
        }
      }

      document.getElementById("genBtn").addEventListener("click", renderNicks);
      document.getElementById("styleSelect").addEventListener("change", renderNicks);
      renderNicks();

      // Загрузка баннера ad.json из этого же репозитория
      fetch("./ad.json?v=" + Date.now(), { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (cfg) {
          if (!cfg || cfg.enabled === false) return;
          const banner = document.getElementById("adBanner");
          const tagEl = document.getElementById("adTag");
          const titleEl = document.getElementById("adTitle");
          const descEl = document.getElementById("adDesc");
          const imgEl = document.getElementById("adImg");
          const vidEl = document.getElementById("adVideo");

          if (cfg.tag) tagEl.textContent = cfg.tag;
          if (cfg.title) titleEl.textContent = cfg.title;
          if (cfg.desc) descEl.textContent = cfg.desc;
          if (cfg.url) banner.href = cfg.url;

          if (cfg.media_type === "image" && cfg.media_url) {
            imgEl.src = cfg.media_url;
            imgEl.style.display = "block";
          } else if (cfg.media_type === "video" && cfg.media_url) {
            vidEl.src = cfg.media_url;
            vidEl.style.display = "block";
            vidEl.play().catch(function () {});
          }

          if (cfg.title || cfg.desc || cfg.media_url) {
            banner.style.display = "block";
          }
        })
        .catch(function () {});
    })();
  </script>

  <!-- Счётчик открытий приложения -->
  <script>
    (function () {
      const API_URL = "https://api.counterapi.dev/v1/nicup_app_kovalev/opens_total/up";
      const now = Date.now();
      if (now - Number(sessionStorage.getItem("nicup_open_ts") || 0) < 1500) return;
      sessionStorage.setItem("nicup_open_ts", String(now));
      fetch(API_URL, { cache: "no-store" }).catch(function () {});
    })();
  </script>
</body>
</html>
