<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Генератор юзернеймов</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0f1115);
      --sec-bg: var(--tg-theme-secondary-bg-color, #1a1d24);
      --text: var(--tg-theme-text-color, #f3f4f6);
      --hint: var(--tg-theme-hint-color, #9ca3af);
      --btn: var(--tg-theme-button-color, #2ea6ff);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --accent: #22c55e;
    }
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 14px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 19px;
      font-weight: 700;
    }
    .panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }
    .label {
      font-size: 12px;
      color: var(--hint);
      margin-bottom: 4px;
    }
    .seg-group {
      display: grid;
      gap: 6px;
    }
    .seg-modes {
      grid-template-columns: 1fr 1fr;
    }
    .seg-counts {
      grid-template-columns: repeat(4, 1fr);
    }
    .seg-btn {
      padding: 10px 8px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: var(--sec-bg);
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
    }
    .seg-btn.active {
      background: var(--btn);
      color: var(--btn-text);
      border-color: var(--btn);
    }
    input {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: var(--sec-bg);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    input:focus {
      border-color: var(--btn);
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }
    .primary-btn {
      padding: 12px 14px;
      border-radius: 10px;
      border: none;
      background: var(--btn);
      color: var(--btn-text);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .secondary-btn {
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: var(--sec-bg);
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--sec-bg);
      cursor: pointer;
      border: 1px solid transparent;
    }
    .item:active {
      transform: scale(0.99);
    }
    .item.copied {
      border-color: var(--accent);
    }
    .nick {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .copy-tag {
      font-size: 12px;
      color: var(--hint);
      font-weight: 600;
    }
    .item.copied .copy-tag {
      color: var(--accent);
    }
    .status-bar {
      min-height: 18px;
      font-size: 12px;
      color: var(--accent);
      margin-bottom: 6px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>Генератор ников</h1>

  <div class="panel">
    <div>
      <div class="label">Режим</div>
      <div class="seg-group seg-modes">
        <button type="button" class="seg-btn active" data-mode="unique">Уникальные</button>
        <button type="button" class="seg-btn" data-mode="random">Случайные (5–6)</button>
      </div>
    </div>

    <div>
      <div class="label">Количество</div>
      <div class="seg-group seg-counts">
        <button type="button" class="seg-btn" data-count="1">1</button>
        <button type="button" class="seg-btn" data-count="5">5</button>
        <button type="button" class="seg-btn active" data-count="10">10</button>
        <button type="button" class="seg-btn" data-count="20">20</button>
      </div>
    </div>

    <div id="baseWordWrap">
      <div class="label">Своя основа для «Уникальных» (опционально)</div>
      <input id="baseWord" type="text" placeholder="Например: void, neon, frost..." maxlength="16" />
    </div>

    <div class="actions">
      <button type="button" class="primary-btn" id="generateBtn">Сгенерировать</button>
      <button type="button" class="secondary-btn" id="copyAllBtn">Копировать все</button>
    </div>
  </div>

  <div class="status
