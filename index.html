<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Генератор юзернеймов</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-page: #f2f2f7;
      --bg-card: #ffffff;
      --bg-fill: #e5e5ea;
      --text-main: #000000;
      --text-sec: #6e6e73;
      --separator: rgba(60, 60, 67, 0.14);
      --ios-blue: #007aff;
      --ios-blue-active: #005ecb;
      --ios-green: #34c759;
      --ios-orange: #ff9500;
      --ios-red: #ff3b30;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-page: #000000;
        --bg-card: #1c1c1e;
        --bg-fill: #2c2c2e;
        --text-main: #ffffff;
        --text-sec: #98989d;
        --separator: rgba(84, 84, 88, 0.36);
        --ios-blue: #0a84ff;
        --ios-blue-active: #0066cc;
        --ios-green: #30d158;
        --ios-orange: #ff9f0a;
        --ios-red: #ff453a;
      }
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 16px 16px 36px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    .header {
      margin-bottom: 14px;
      padding: 0 4px;
    }

    .title {
      margin: 0;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .subtitle {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--text-sec);
    }

    .section-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--text-sec);
      margin: 0 0 7px 6px;
    }

    .card {
      background-color: var(--bg-card);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 16px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .seg-control {
      display: grid;
      gap: 4px;
      background-color: var(--bg-fill);
      padding: 3px;
      border-radius: 10px;
    }

    .seg-modes {
      grid-template-columns: 1fr 1fr;
    }

    .seg-counts {
      grid-template-columns: repeat(4, 1fr);
    }

    .seg-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--text-main);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 6px;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }

    .seg-btn:active {
      transform: scale(0.96);
    }

    .seg-btn.active {
      background-color: var(--bg-card);
      color: var(--text-main);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
    }

    .input-wrap {
      margin-top: 12px;
    }

    .ios-input {
      width: 100%;
      appearance: none;
      border: 1px solid var(--separator);
      background-color: var(--bg-fill);
      color: var(--text-main);
      font-family: inherit;
      font-size: 15px;
      padding: 11px 13px;
      border-radius: 11px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .ios-input::placeholder {
      color: var(--text-sec);
    }

    .ios-input:focus {
      border-color: var(--ios-blue);
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-top: 12px;
    }

    .main-btn {
      appearance: none;
      border: none;
      background-color: var(--ios-blue);
      color: #ffffff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      padding: 12px 14px;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.15s ease;
    }

    .main-btn:active {
      transform: scale(0.97);
      background-color: var(--ios-blue-active);
    }

    .ghost-btn {
      appearance: none;
      border: none;
      background-color: var(--bg-fill);
      color: var(--ios-blue);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 12px 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.15s ease;
    }

    .ghost-btn:active {
      transform: scale(0.97);
      opacity: 0.75;
    }

    .check-all-btn {
      width: 100%;
      margin-top: 8px;
      appearance: none;
      border: 1px solid var(--separator);
      background-color: transparent;
      color: var(--text-main);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 12px;
      border-radius: 11px;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.15s ease;
    }

    .check-all-btn:active {
      transform: scale(0.98);
      background-color: var(--bg-fill);
    }

    .toast-line {
      min-height: 20px;
      padding: 0 6px;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--ios-green);
    }

    .results-card {
      background-color: var(--bg-card);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .nick-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 11px 12px;
      border-bottom: 1px solid var(--separator);
      transition: background-color 0.15s ease;
    }

    .nick-row:last-child {
      border-bottom: none;
    }

    .nick-row.is-copied {
      background-color: rgba(52, 199, 89, 0.08);
    }

    .nick-left {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .nick-link {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-main);
      text-decoration: none;
      word-break: break-all;
      cursor: pointer;
    }

    .status-badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-sec);
    }

    .status-badge.free-hint {
      color: var(--ios-green);
    }

    .status-badge.manual {
      color: var(--ios-orange);
    }

    .status-badge.taken-hint {
      color: var(--ios-red);
    }

    .row-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .mini-btn {
      appearance: none;
      border: none;
      background-color: var(--bg-fill);
      color: var(--ios-blue);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.15s ease, color 0.15s ease;
    }

    .mini-btn:active {
      transform: scale(0.94);
    }

    .mini-btn.copied {
      background-color: var(--ios-green);
      color: #ffffff;
    }

    .footnote {
      margin: 10px 4px 0;
      font-size: 12px;
      line-height: 1.45;
      color: var(--text-sec);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="title">Юзернеймы</h1>
    <p class="subtitle">Генерация, быстрая проверка и копирование для канала</p>
  </div>

  <div class="section-label">Параметры</div>
  <div class="card">
    <div class="seg-control seg-modes" id="modeGroup">
      <button type="button" class="seg-btn active" data-mode="unique">Уникальные</button>
      <button type="button" class="seg-btn" data-mode="random">Случайные (5–6)</button>
    </div>

    <div style="margin-top: 10px;">
      <div class="seg-control seg-counts" id="countGroup">
        <button type="button" class="seg-btn" data-count="1">1</button>
        <button type="button" class="seg-btn" data-count="5">5</button>
        <button type="button" class="seg-btn active" data-count="10">10</button>
        <button type="button" class="seg-btn" data-count="20">20</button>
      </div>
    </div>

    <div class="input-wrap" id="baseWordWrap">
      <input
        type="text"
        id="baseWord"
        class="ios-input"
        placeholder="Слово-основа (необязательно)"
        maxlength="16"
        autocomplete="off"
        autocapitalize="none"
      />
    </div>

    <div class="btn-row">
      <button type="button" class="main-btn" id="genBtn">Сгенерировать</button>
      <button type="button" class="ghost-btn" id="copyAllBtn">Копировать все</button>
    </div>

    <button type="button" class="check-all-btn" id="checkAllBtn">Проверить все в списке</button>
  </div>

  <div class="toast-line" id="toastLine"></div>

  <div class="section-label">Список вариантов</div>
  <div class="results-card" id="resultsList"></div>

  <p class="footnote">
    Нажми на <b>@ник</b>, чтобы открыть <code>t.me/ник</code> и сразу увидеть в Telegram, свободен ли он. Кнопка <b>Проверить</b> делает быстрый сетевой запрос и подсказывает статус, но точный ответ всегда даёт сам Telegram.
  </p>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    let mode = "unique";
    let count = 10;
    let generated = [];

    const prefixes = [
      "pure", "dark", "neo", "zero", "void", "raw", "lost", "true",
      "cold", "wild", "soft", "high", "deep", "next", "solo", "real"
    ];
    const roots = [
      "flux", "echo", "wave", "drift", "pulse", "spark", "mint", "wolf",
      "nova", "core", "vibe", "shade", "frost", "loom", "rift", "zen",
      "glow", "path", "myth", "bolt", "crest", "haven", "cipher", "ember"
    ];
    const suffixes = [
      "lab", "hub", "zone", "mode", "x", "ly", "io", "hq",
      "way", "box", "den", "craft", "works", "line", "spot", "club"
    ];

    const letters = "abcdefghijklmnopqrstuvwxyz";
    const alphaNum = "abcdefghijklmnopqrstuvwxyz0123456789";

    function pick(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function buildUnique(customWord) {
      const clean = customWord.toLowerCase().replace(/[^a-z0-9]/g, "");
      if (clean.length >= 2) {
        const templates = [
          () => `${pick(prefixes)}_${clean}`,
          () => `${clean}_${pick(suffixes)}`,
          () => `${clean}${pick(roots)}`,
          () => `${pick(roots)}_${clean}`,
          () => `${clean}${randInt(10, 99)}`
        ];
        return pick(templates)();
      }

      const templates = [
        () => `${pick(prefixes)}_${pick(roots)}`,
        () => `${pick(roots)}_${pick(suffixes)}`,
        () => `${pick(prefixes)}${pick(roots)}`,
        () => `${pick(roots)}${pick(suffixes)}`,
        () => `${pick(roots)}_${randInt(10, 999)}`
      ];
      return pick(templates)();
    }

    function buildRandom5to6() {
      const len = randInt(5, 6);
      let str = "";
      for (let i = 0; i < len; i++) {
        str += alphaNum[Math.floor(Math.random() * alphaNum.length)];
      }
      if (!/[a-z]/.test(str)) {
        const idx = randInt(0, len - 1);
        str = str.slice(0, idx) + pick(letters.split("")) + str.slice(idx + 1);
      }
      return str;
    }

    function isValidNick(nick) {
      return /^[a-z0-9_]{5,32}$/.test(nick) && !/^_|_$|__/.test(nick) && /[a-z]/.test(nick);
    }

    function showToast(msg) {
      const el = document.getElementById("toastLine");
      el.textContent = msg;
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => {
        el.textContent = "";
      }, 1900);
    }

    async function writeClipboard(text) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (_) {}

      const area = document.createElement("textarea");
      area.value = text;
      area.style.position = "fixed";
      area.style.opacity = "0";
      document.body.appendChild(area);
      area.focus();
      area.select();
      let ok = false;
      try {
        ok = document.execCommand("copy");
      } catch (_) {
        ok = false;
      }
      document.body.removeChild(area);
      return ok;
    }

    function haptic(style = "light") {
      if (tg && tg.HapticFeedback) {
        try {
          tg.HapticFeedback.impactOccurred(style);
        } catch (_) {}
      }
    }

    function openTelegramUsername(nick) {
      const url = `https://t.me/${nick}`;
      if (tg && tg.openLink) {
        tg.openLink(url);
      } else {
        window.open(url, "_blank", "noopener,noreferrer");
      }
    }

    async function probeUsername(nick, badgeEl) {
      badgeEl.className = "status-badge";
      badgeEl.textContent = "Проверяем...";

      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 3500);
        await fetch(`https://t.me/${nick}`, {
          mode: "no-cors",
          cache: "no-store",
          signal: controller.signal
        });
        clearTimeout(timeout);

        badgeEl.className = "status-badge manual";
        badgeEl.textContent = "Запрос прошёл · сверь по @ник";
      } catch (_) {
        badgeEl.className = "status-badge taken-hint";
        badgeEl.textContent = "Таймаут / блок · проверь @ник";
      }
    }

    function renderList() {
      const customWord = document.getElementById("baseWord").value.trim();
      const uniqueSet = new Set();
      let guard = 0;

      while (uniqueSet.size < count && guard < 500) {
        guard++;
        const candidate = mode === "unique" ? buildUnique(customWord) : buildRandom5to6();
        if (isValidNick(candidate)) {
          uniqueSet.add(candidate);
        }
      }

      generated = Array.from(uniqueSet);
      const container = document.getElementById("resultsList");
      container.innerHTML = "";

      generated.forEach((nick) => {
        const row = document.createElement("div");
        row.className = "nick-row";

        const left = document.createElement("div");
        left.className = "nick-left";

        const link = document.createElement("a");
        link.className = "nick-link";
        link.textContent = "@" + nick;
        link.href = `https://t.me/${nick}`;
        link.addEventListener("click", (e) => {
          e.preventDefault();
          haptic();
          openTelegramUsername(nick);
        });

        const badge = document.createElement("span");
        badge.className = "status-badge";
        badge.textContent = "Не проверен";

        left.appendChild(link);
        left.appendChild(badge);

        const actions = document.createElement("div");
        actions.className = "row-actions";

        const checkBtn = document.createElement("button");
        checkBtn.type = "button";
        checkBtn.className = "mini-btn";
        checkBtn.textContent = "Проверить";
        checkBtn.addEventListener("click", async () => {
          haptic();
          await probeUsername(nick, badge);
        });

        const copyBtn = document.createElement("button");
        copyBtn.type = "button";
        copyBtn.className = "mini-btn";
        copyBtn.textContent = "Копировать";
        copyBtn.addEventListener("click", async () => {
          await writeClipboard("@" + nick);
          haptic();

          copyBtn.classList.add("copied");
          row.classList.add("is-copied");
          copyBtn.textContent = "Готово";
          showToast(`Скопировано @${nick}`);

          setTimeout(() => {
            copyBtn.classList.remove("copied");
            row.classList.remove("is-copied");
            copyBtn.textContent = "Копировать";
          }, 1500);
        });

        actions.appendChild(checkBtn);
        actions.appendChild(copyBtn);

        row.appendChild(left);
        row.appendChild(actions);
        container.appendChild(row);
      });
    }

    document.querySelectorAll("#modeGroup .seg-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#modeGroup .seg-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        mode = btn.dataset.mode;
        document.getElementById("baseWordWrap").style.display = mode === "unique" ? "block" : "none";
        haptic();
        renderList();
      });
    });

    document.querySelectorAll("#countGroup .seg-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#countGroup .seg-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        count = Number(btn.dataset.count);
        haptic();
        renderList();
      });
    });

    document.getElementById("genBtn").addEventListener("click", () => {
      haptic();
      renderList();
      showToast(`Сгенерировано вариантов: ${generated.length}`);
    });

    document.getElementById("baseWord").addEventListener("input", () => {
      if (mode === "unique") {
        renderList();
      }
    });

    document.getElementById("copyAllBtn").addEventListener("click", async () => {
      if (!generated.length) return;
      const text = generated.map((n) => "@" + n).join("\n");
      await writeClipboard(text);
      haptic();
      showToast(`Скопировано списком (${generated.length})`);
    });

    document.getElementById("checkAllBtn").addEventListener("click", async () => {
      const rows = Array.from(document.querySelectorAll("#resultsList .nick-row"));
      if (!rows.length) return;
      haptic("medium");
      showToast("Проверяем список...");

      for (const row of rows) {
        const nick = row.querySelector(".nick-link").textContent.replace(/^@/, "");
        const badge = row.querySelector(".status-badge");
        await probeUsername(nick, badge);
      }

      showToast("Проверка списка завершена");
    });

    renderList();
  </script>
</body>
</html>
