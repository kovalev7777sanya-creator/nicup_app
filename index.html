<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NicUp — Генератор юзернеймов</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-deep: #040711;
      --bg-mid: #081226;
      --orb-blue: rgba(37, 99, 235, 0.34);
      --orb-cyan: rgba(56, 189, 248, 0.22);
      --orb-indigo: rgba(29, 78, 216, 0.26);

      --glass-surface: rgba(14, 24, 48, 0.58);
      --glass-surface-strong: rgba(20, 36, 72, 0.74);
      --glass-recessed: rgba(4, 9, 22, 0.68);
      --glass-border: rgba(96, 165, 250, 0.24);
      --glass-highlight: rgba(186, 230, 253, 0.28);

      --text-main: #ffffff;
      --text-sec: rgba(219, 234, 254, 0.74);
      --blue-main: #2563eb;
      --blue-bright: #38bdf8;
      --green: #34d399;

      --ios-spring: cubic-bezier(0.22, 1.16, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 20% 0%, #0b1b3d 0%, var(--bg-deep) 62%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      overflow-x: hidden;
      padding: 14px 16px 106px;
      position: relative;
    }

    button,
    input,
    .nick-text,
    .section-title,
    .ad-title,
    .nav-pill-btn {
      font-weight: 800;
    }

    /* Фоновые световые пятна для жидкого стекла */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(75px);
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 {
      width: 260px;
      height: 260px;
      top: -60px;
      left: -50px;
      background: var(--orb-blue);
    }
    .orb-2 {
      width: 240px;
      height: 240px;
      top: 220px;
      right: -70px;
      background: var(--orb-cyan);
    }
    .orb-3 {
      width: 280px;
      height: 280px;
      bottom: 40px;
      left: 10%;
      background: var(--orb-indigo);
    }

    .app-wrap {
      position: relative;
      z-index: 1;
      max-width: 460px;
      margin: 0 auto;
    }

    /* Верхняя шапка: логотип NicUp слева без чёрного фона + онлайн справа */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 2px 12px;
      margin-bottom: 6px;
      background: transparent;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      background: transparent;
      user-select: none;
      line-height: 1;
    }

    .brand-wordmark {
      display: inline-block;
      font-family: "Arial Black", "Segoe UI Black", "SF Pro Display", Impact, sans-serif;
      font-size: 29px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -0.045em;
      line-height: 1;
      background: transparent;
    }

    .brand-nic {
      color: #ffffff;
    }

    .brand-up {
      color: #1677ff;
      margin-left: 1px;
    }

    .online-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 13px;
      border-radius: 999px;
      background: var(--glass-surface);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(52, 211, 153, 0.34);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.2),
        0 8px 20px rgba(0, 0, 0, 0.35);
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1;
    }

    .online-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
    }

    /* Стеклянные карточки */
    .glass-card {
      background: var(--glass-surface);
      backdrop-filter: blur(26px) saturate(185%);
      -webkit-backdrop-filter: blur(26px) saturate(185%);
      border: 1px solid var(--glass-border);
      border-radius: 26px;
      box-shadow:
        inset 0 1px 0 var(--glass-highlight),
        0 14px 32px rgba(0, 0, 0, 0.45);
    }

    /* Увеличенный блок рекламы */
    .ad-banner {
      display: block;
      position: relative;
      text-decoration: none;
      color: var(--text-main);
      padding: 24px 22px;
      min-height: 164px;
      border-radius: 28px;
      margin-bottom: 16px;
      background:
        radial-gradient(circle at 88% 22%, rgba(56, 189, 248, 0.34), transparent 52%),
        linear-gradient(135deg, rgba(15, 29, 64, 0.9) 0%, rgba(29, 78, 216, 0.58) 100%);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid rgba(96, 165, 250, 0.38);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.28),
        0 16px 36px rgba(3, 10, 28, 0.55);
      overflow: hidden;
      transition: transform 0.24s var(--ios-spring), border-color 0.2s ease;
    }

    .ad-banner::before {
      content: "";
      position: absolute;
      top: -48%;
      left: -25%;
      width: 150%;
      height: 88%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0));
      transform: rotate(-4deg);
      pointer-events: none;
    }

    .ad-banner:active {
      transform: scale(0.98);
    }

    .ad-top {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .ad-tag {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #bae6fd;
      background: rgba(37, 99, 235, 0.38);
      border: 1px solid rgba(125, 211, 252, 0.32);
      padding: 4px 10px;
      border-radius: 999px;
    }

    .ad-title {
      position: relative;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 7px;
      line-height: 1.2;
    }

    .ad-desc {
      position: relative;
      font-size: 14px;
      color: var(--text-sec);
      line-height: 1.42;
      margin-bottom: 16px;
      max-width: 90%;
    }

    .ad-cta {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 19px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.35),
        0 8px 18px rgba(29, 78, 216, 0.45);
    }

    /* Переключение вкладок */
    .tab-view {
      display: none;
    }
    .tab-view.active {
      display: block;
      animation: fadeSlide 0.25s ease;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Блок генератора */
    .gen-card {
      padding: 18px;
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .control-group {
      margin-bottom: 14px;
    }

    .control-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-sec);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .length-val {
      color: var(--blue-bright);
      font-weight: 800;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #3b82f6;
      cursor: pointer;
    }

    .glass-input {
      width: 100%;
      padding: 12px 15px;
      border-radius: 18px;
      border: 1px solid var(--glass-border);
      background: var(--glass-recessed);
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .glass-input:focus {
      border-color: var(--blue-bright);
    }

    .toggles-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .pill-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 12px;
      border-radius: 999px;
      background: var(--glass-recessed);
      border: 1px solid var(--glass-border);
      color: var(--text-sec);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s var(--ios-spring);
      user-select: none;
    }

    .pill-toggle.active {
      background: rgba(37, 99, 235, 0.3);
      border-color: rgba(96, 165, 250, 0.65);
      color: #ffffff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }

    .primary-btn {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.35),
        0 10px 24px rgba(37, 99, 235, 0.45);
      transition: transform 0.2s var(--ios-spring);
    }

    .primary-btn:active {
      transform: scale(0.97);
    }

    .toast-line {
      min-height: 20px;
      padding: 0 6px;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--green);
      text-align: center;
    }

    /* Список сгенерированных ников */
    .results-card {
      overflow: hidden;
    }

    .nick-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      border-bottom: 1px solid rgba(96, 165, 250, 0.14);
    }

    .nick-row:last-child {
      border-bottom: none;
    }

    .nick-text {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.01em;
      color: #f8fafc;
    }

    .copy-pill {
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid rgba(96, 165, 250, 0.34);
      background: rgba(37, 99, 235, 0.24);
      color: #bae6fd;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.18s var(--ios-spring), background 0.18s ease;
    }

    .copy-pill:active {
      transform: scale(0.94);
    }

    /* Вкладка Профиль */
    .profile-card {
      padding: 22px 18px;
      text-align: center;
    }

    .profile-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 900;
      background: linear-gradient(135deg, #3b82f6, #1e3a8a);
      border: 2px solid rgba(147, 197, 253, 0.45);
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.4);
    }

    .profile-name {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .profile-sub {
      font-size: 13px;
      color: var(--text-sec);
      margin-bottom: 18px;
    }

    .profile-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      text-align: left;
    }

    .info-box {
      padding: 12px 14px;
      border-radius: 20px;
      background: var(--glass-recessed);
      border: 1px solid var(--glass-border);
    }

    .info-box-label {
      font-size: 11px;
      color: var(--text-sec);
      margin-bottom: 4px;
    }

    .info-box-val {
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
    }

    /* Нижняя плавающая панель с 2 круглыми кнопками */
    .bottom-dock-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 14px;
      z-index: 50;
      display: flex;
      justify-content: center;
      padding: 0 16px;
      pointer-events: none;
    }

    .bottom-dock {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px;
      border-radius: 999px;
      background: rgba(10, 18, 38, 0.78);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border: 1px solid rgba(96, 165, 250, 0.28);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.24),
        0 14px 34px rgba(0, 0, 0, 0.65);
    }

    .nav-pill-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 136px;
      padding: 12px 22px;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: var(--text-sec);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.24s var(--ios-spring);
    }

    .nav-pill-btn.active {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.48), rgba(29, 78, 216, 0.58));
      color: #ffffff;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.3),
        0 6px 16px rgba(37, 99, 235, 0.35);
    }

    .nav-pill-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <div class="app-wrap">
    <!-- Шапка: логотип NicUp слева + онлайн справа -->
    <header class="top-header">
      <div class="brand-logo" aria-label="NicUp">
        <span class="brand-wordmark">
          <span class="brand-nic">Nic</span><span class="brand-up">Up</span>
        </span>
      </div>

      <div class="online-badge" title="Онлайн в приложении">
        <span class="online-dot"></span>
        <span id="onlineCounter">100</span>
      </div>
    </header>

    <!-- ВКЛАДКА 1: ГЛАВНАЯ -->
    <main id="tabHome" class="tab-view active">
      <!-- Увеличенный рекламный баннер -->
      <a id="adBanner" class="ad-banner" href="https://t.me" target="_blank" rel="noopener">
        <div class="ad-top">
          <span class="ad-tag">Реклама</span>
        </div>
        <div id="adTitle" class="ad-title">Подпишись на наш канал</div>
        <div id="adDesc" class="ad-desc">Свежие подборки редких юзернеймов и обновления NicUp каждый день</div>
        <span class="ad-cta">Перейти →</span>
      </a>

      <!-- Генератор юзернеймов -->
      <section class="glass-card gen-card">
        <div class="section-title">
          <span>Генератор юзернеймов</span>
        </div>

        <div class="control-group">
          <div class="control-label">
            <span>Длина ника</span>
            <span id="lenLabel" class="length-val">7 символов</span>
          </div>
          <input id="lenRange" type="range" min="5" max="15" value="7" />
        </div>

        <div class="control-group">
          <input id="prefixInput" class="glass-input" type="text" maxlength="10" placeholder="Ключевое слово (необязательно)" />
        </div>

        <div class="toggles-row">
          <button id="toggleDigits" type="button" class="pill-toggle active">Цифры 0–9</button>
          <button id="toggleUnderscore" type="button" class="pill-toggle">Подчёркивание _</button>
        </div>

        <button id="generateBtn" type="button" class="primary-btn">Сгенерировать ники</button>
      </section>

      <div id="toastLine" class="toast-line"></div>

      <section id="resultsCard" class="glass-card results-card"></section>
    </main>

    <!-- ВКЛАДКА 2: ПРОФИЛЬ -->
    <section id="tabProfile" class="tab-view">
      <div class="glass-card profile-card">
        <div id="profileAvatar" class="profile-avatar">N</div>
        <div id="profileName" class="profile-name">Пользователь Telegram</div>
        <div id="profileUsername" class="profile-sub">@nicup_user</div>

        <div class="profile-info-grid">
          <div class="info-box">
            <div class="info-box-label">Ваш ID</div>
            <div id="profileId" class="info-box-val">—</div>
          </div>
          <div class="info-box">
            <div class="info-box-label">Статус</div>
            <div class="info-box-val" style="color: #38bdf8;">Активен</div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- Нижняя панель с 2 круглыми кнопками -->
  <div class="bottom-dock-wrap">
    <nav class="bottom-dock" aria-label="Навигация">
      <button type="button" class="nav-pill-btn active" data-tab="tabHome">Главная</button>
      <button type="button" class="nav-pill-btn" data-tab="tabProfile">Профиль</button>
    </nav>
  </div>

  <script>
    (function () {
      const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
      if (tg) {
        tg.ready();
        tg.expand();
      }

      // Навигация между вкладками "Главная" и "Профиль"
      const navBtns = document.querySelectorAll(".nav-pill-btn");
      const tabViews = document.querySelectorAll(".tab-view");

      navBtns.forEach(function (btn) {
        btn.addEventListener("click", function () {
          const targetId = btn.getAttribute("data-tab");
          navBtns.forEach(function (b) { b.classList.remove("active"); });
          tabViews.forEach(function (v) { v.classList.remove("active"); });
          btn.classList.add("active");
          const targetEl = document.getElementById(targetId);
          if (targetEl) targetEl.classList.add("active");
        });
      });

      // Заполнение данных профиля из Telegram WebApp
      const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
      if (tgUser) {
        const fullName = [tgUser.first_name, tgUser.last_name].filter(Boolean).join(" ") || "Пользователь";
        document.getElementById("profileName").textContent = fullName;
        document.getElementById("profileAvatar").textContent = fullName.charAt(0).toUpperCase();
        document.getElementById("profileUsername").textContent = tgUser.username ? "@" + tgUser.username : "Без юзернейма";
        document.getElementById("profileId").textContent = String(tgUser.id);
      }

      // Логика генератора ников
      const lenRange = document.getElementById("lenRange");
      const lenLabel = document.getElementById("lenLabel");
      const prefixInput = document.getElementById("prefixInput");
      const toggleDigits = document.getElementById("toggleDigits");
      const toggleUnderscore = document.getElementById("toggleUnderscore");
      const generateBtn = document.getElementById("generateBtn");
      const resultsCard = document.getElementById("resultsCard");
      const toastLine = document.getElementById("toastLine");

      let useDigits = true;
      let useUnderscore = false;

      lenRange.addEventListener("input", function () {
        lenLabel.textContent = lenRange.value + " символов";
      });

      toggleDigits.addEventListener("click", function () {
        useDigits = !useDigits;
        toggleDigits.classList.toggle("active", useDigits);
      });

      toggleUnderscore.addEventListener("click", function () {
        useUnderscore = !useUnderscore;
        toggleUnderscore.classList.toggle("active", useUnderscore);
      });

      function buildUsername(length, rawPrefix) {
        const vowels = "aeiouy";
        const consonants = "bcdfghjklmnpqrstvwxz";
        const digits = "0123456789";

        let cleanPrefix = (rawPrefix || "").toLowerCase().replace(/[^a-z0-9_]/g, "");
        if (cleanPrefix && !/^[a-z]/.test(cleanPrefix)) {
          cleanPrefix = "x" + cleanPrefix;
        }

        let res = cleanPrefix.slice(0, length);
        while (res.length < length) {
          const prev = res[res.length - 1] || "";
          if (useUnderscore && res.length > 2 && res.length < length - 2 && prev !== "_" && Math.random() < 0.14) {
            res += "_";
            continue;
          }
          if (useDigits && res.length >= length - 2 && Math.random() < 0.35) {
            res += digits[Math.floor(Math.random() * digits.length)];
            continue;
          }
          const isPrevVowel = vowels.indexOf(prev) !== -1;
          const pool = isPrevVowel ? consonants : vowels;
          res += pool[Math.floor(Math.random() * pool.length)];
        }
        return "@" + res;
      }

      function renderNicknames() {
        const len = Number(lenRange.value) || 7;
        const prefix = prefixInput.value.trim();
        const set = new Set();
        let guard = 0;
        while (set.size < 6 && guard < 80) {
          set.add(buildUsername(len, prefix));
          guard++;
        }

        resultsCard.innerHTML = "";
        set.forEach(function (nick) {
          const row = document.createElement("div");
          row.className = "nick-row";

          const span = document.createElement("span");
          span.className = "nick-text";
          span.textContent = nick;

          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "copy-pill";
          btn.textContent = "Копировать";
          btn.addEventListener("click", function () {
            if (navigator.clipboard) {
              navigator.clipboard.writeText(nick).catch(function () {});
            }
            toastLine.textContent = "Скопировано: " + nick;
            setTimeout(function () {
              if (toastLine.textContent === "Скопировано: " + nick) {
                toastLine.textContent = "";
              }
            }, 1800);
          });

          row.appendChild(span);
          row.appendChild(btn);
          resultsCard.appendChild(row);
        });
      }

      generateBtn.addEventListener("click", renderNicknames);
      renderNicknames();
    })();
  </script>

  <!-- Статистика JSONBin.io, онлайн от 100 и загрузка рекламы ad.json -->
  <script>
    (function () {
      const BIN_ID = "6b0938883957a11c13b6397b";
      const API_KEY = "$2a$10$nbho.No3FFfEiqFA5FQcwuYL/kMVR1KOPuHPv0vsFdgk9eEiLbAVa";
      const BIN_URL = "https://api.jsonbin.io/v3/b/" + BIN_ID;

      const ONLINE_BASE = 100;
      const ONLINE_TTL_MS = 60000;

      function todayKey() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return y + "-" + m + "-" + day;
      }

      function getUserId() {
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
        if (u && u.id) return String(u.id);
        let localId = localStorage.getItem("nicup_local_uid");
        if (!localId) {
          localId = "web_" + Math.random().toString(36).slice(2, 10);
          localStorage.setItem("nicup_local_uid", localId);
        }
        return localId;
      }

      function renderOnlineCount(onlineMap) {
        const el = document.getElementById("onlineCounter");
        if (!el) return;
        const nowTs = Date.now();
        let active = 0;
        Object.keys(onlineMap || {}).forEach(function (k) {
          if (nowTs - Number(onlineMap[k] || 0) <= ONLINE_TTL_MS) {
            active++;
          }
        });
        el.textContent = String(ONLINE_BASE + active);
      }

      function mutateBin(updater) {
        return fetch(BIN_URL + "/latest", {
          cache: "no-store",
          headers: { "X-Master-Key": API_KEY }
        })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (res) {
            const rec = (res && res.record && typeof res.record === "object") ? res.record : {};
            const data = {
              users: (rec.users && typeof rec.users === "object") ? rec.users : {},
              days: (rec.days && typeof rec.days === "object") ? rec.days : {},
              ad_clicks: typeof rec.ad_clicks === "number" ? rec.ad_clicks : 0,
              online_map: (rec.online_map && typeof rec.online_map === "object") ? rec.online_map : {}
            };
            updater(data);
            renderOnlineCount(data.online_map);
            return fetch(BIN_URL, {
              method: "PUT",
              headers: {
                "Content-Type": "application/json",
                "X-Master-Key": API_KEY
              },
              body: JSON.stringify(data)
            });
          })
          .catch(function () {});
      }

      function syncOnline(shouldPing) {
        const uid = getUserId();
        const nowTs = Date.now();
        mutateBin(function (data) {
          if (!data.online_map || typeof data.online_map !== "object") {
            data.online_map = {};
          }
          if (shouldPing && !document.hidden) {
            data.online_map[uid] = nowTs;
          }
          Object.keys(data.online_map).forEach(function (k) {
            if (nowTs - Number(data.online_map[k] || 0) > ONLINE_TTL_MS) {
              delete data.online_map[k];
            }
          });
        });
      }

      const now = Date.now();
      if (now - Number(sessionStorage.getItem("nicup_open_ts") || 0) > 1500) {
        sessionStorage.setItem("nicup_open_ts", String(now));
        const uid = getUserId();
        const day = todayKey();
        mutateBin(function (data) {
          if (!data.users[uid]) {
            data.users[uid] = { first_seen: day, last_seen: day };
          } else {
            data.users[uid].last_seen = day;
          }
          if (!data.days[day]) {
            data.days[day] = { new_users: 0, active_users: [] };
          }
          if (!Array.isArray(data.days[day].active_users)) {
            data.days[day].active_users = [];
          }
          if (data.days[day].active_users.indexOf(uid) === -1) {
            data.days[day].active_users.push(uid);
          }
          data.online_map[uid] = Date.now();
        });
      } else {
        syncOnline(true);
      }

      setInterval(function () {
        syncOnline(true);
      }, 20000);

      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) {
          syncOnline(true);
        }
      });

      fetch("./ad.json?t=" + Date.now(), { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (cfg) {
          const banner = document.getElementById("adBanner");
          if (!banner) return;

          if (cfg.enabled === false) {
            banner.style.setProperty("display", "none", "important");
            return;
          }

          const titleEl = document.getElementById("adTitle");
          const descEl = document.getElementById("adDesc");

          if (titleEl && cfg.title) titleEl.textContent = cfg.title;
          if (descEl && cfg.desc) descEl.textContent = cfg.desc;
          if (cfg.url) banner.href = cfg.url;

          banner.addEventListener("click", function () {
            mutateBin(function (data) {
              data.ad_clicks = (typeof data.ad_clicks === "number" ? data.ad_clicks : 0) + 1;
            });
          });

          banner.style.setProperty("display", "block", "important");
        })
        .catch(function () {});
    })();
  </script>
</body>
</html>
