<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NicUp</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #060b19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px 14px 90px;
    }

    .wrap {
      max-width: 460px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .logo {
      font-size: 26px;
      font-weight: 900;
      font-style: italic;
    }

    .logo span {
      color: #3b82f6;
    }

    .avatar-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid #60a5fa;
      background: #1d4ed8;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      overflow: hidden;
    }

    .avatar-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .ad-box {
      display: block;
      text-decoration: none;
      color: #fff;
      background: #11224a;
      border: 1px solid #2563eb;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .ad-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      background: #1d4ed8;
      padding: 3px 8px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .ad-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .ad-desc {
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 10px;
    }

    .ad-btn {
      display: inline-block;
      background: #2563eb;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      padding: 7px 14px;
      border-radius: 999px;
    }

    .card {
      background: #0d172e;
      border: 1px solid #1e3a8a;
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    input[type="range"] {
      width: 100%;
      margin-bottom: 12px;
    }

    .inp {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid #1e3a8a;
      background: #070d1c;
      color: #fff;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .btn {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid #2563eb;
      background: #132244;
      color: #e2e8f0;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn.active {
      background: #2563eb;
      color: #fff;
      border-color: #60a5fa;
    }

    .gen-btn {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: #2563eb;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .status-msg {
      text-align: center;
      font-size: 12px;
      color: #38bdf8;
      margin-bottom: 10px;
      min-height: 18px;
    }

    .nick-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid #172544;
    }

    .nick-item:last-child {
      border-bottom: none;
    }

    .nick-check {
      background: none;
      border: none;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      text-align: left;
      cursor: pointer;
      flex: 1;
      min-width: 0;
    }

    .nick-tag {
      font-size: 11px;
      color: #38bdf8;
      margin-left: 6px;
    }

    .mini-btn {
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid #2563eb;
      background: #132244;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .heart-btn {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      border: 1px solid #2563eb;
      background: #132244;
      color: #94a3b8;
      font-size: 14px;
      cursor: pointer;
    }

    .heart-btn.on {
      color: #fb7185;
      border-color: #fb7185;
    }

    .tab-pane {
      display: none;
    }

    .tab-pane.show {
      display: block;
    }

    .profile-box {
      text-align: center;
      margin-bottom: 12px;
    }

    .profile-ava {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #2563eb;
      color: #fff;
      font-size: 24px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 8px;
      overflow: hidden;
    }

    .profile-ava img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .saved-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid #172544;
      font-size: 13px;
    }

    .saved-row:last-child {
      border-bottom: none;
    }

    .bottom-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: #091124;
      border-top: 1px solid #1e3a8a;
      padding: 8px 14px;
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .bottom-bar button {
      flex: 1;
      max-width: 220px;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid #2563eb;
      background: #132244;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .bottom-bar button.active {
      background: #2563eb;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="logo">Nic<span>Up</span></div>
      <button id="topAvaBtn" class="avatar-btn" type="button" onclick="showTab('profile')">N</button>
    </div>

    <div id="pane-home" class="tab-pane show">
      <a id="adLink" class="ad-box" href="https://t.me" target="_blank" rel="noopener noreferrer">
        <div class="ad-tag">Реклама</div>
        <div id="adTitle" class="ad-title">Подпишись на наш канал</div>
        <div id="adDesc" class="ad-desc">Свежие подборки ников и обновления NicUp</div>
        <div class="ad-btn">Перейти →</div>
      </a>

      <div class="card">
        <div class="card-title">Генератор юзернеймов</div>

        <div class="label-row">
          <span>Длина ника</span>
          <strong id="lenText">7 символов</strong>
        </div>
        <input id="lenInput" type="range" min="5" max="15" value="7" oninput="document.getElementById('lenText').textContent = this.value + ' символов'" />

        <input id="wordInput" class="inp" type="text" maxlength="12" placeholder="Ключевое слово (необязательно)" />
        <input id="exclInput" class="inp" type="text" maxlength="40" placeholder="Исключить буквы или слова (напр: z, q, cyber)" />

        <div class="row-2">
          <button id="btnDigits" class="btn active" type="button" onclick="toggleOpt('digits')">Цифры 0–9</button>
          <button id="btnUnder" class="btn" type="button" onclick="toggleOpt('under')">Подчёркивание _</button>
        </div>

        <button id="btnNoAt" class="btn" style="margin-bottom:10px;" type="button" onclick="toggleOpt('noAt')">Копировать без @</button>

        <div class="row-2">
          <button id="btnModeUnique" class="btn active" type="button" onclick="setMode('unique')">Уникальные</button>
          <button id="btnModeRandom" class="btn" type="button" onclick="setMode('random')">Случайные</button>
        </div>

        <button class="gen-btn" type="button" onclick="generateTen()">Сгенерировать</button>
      </div>

      <div id="msgBox" class="status-msg">Выбери режим и нажми «Сгенерировать»</div>
      <div id="listBox" class="card" style="padding:0; display:none;"></div>
    </div>

    <div id="pane-profile" class="tab-pane">
      <div class="card profile-box">
        <div id="profAva" class="profile-ava">N</div>
        <div id="profName" style="font-size:18px;font-weight:800;margin-bottom:4px;">Пользователь</div>
        <div id="profUser" style="font-size:13px;color:#94a3b8;margin-bottom:12px;">@telegram</div>
        <div style="font-size:12px;color:#cbd5e1;margin-bottom:12px;">ID: <span id="profId">—</span></div>
        <div class="row-2" style="margin-bottom:0;">
          <a id="supportUrlBtn" class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center;" href="https://t.me" target="_blank" rel="noopener noreferrer">Поддержка</a>
          <a id="channelUrlBtn" class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center;" href="https://t.me" target="_blank" rel="noopener noreferrer">Канал</a>
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          <span>Избранное</span>
          <button class="mini-btn" type="button" onclick="clearFavs()">Очистить</button>
        </div>
        <div id="favBox"></div>
      </div>

      <div class="card">
        <div class="card-title">
          <span>История</span>
          <button class="mini-btn" type="button" onclick="clearHist()">Очистить</button>
        </div>
        <div id="histBox"></div>
      </div>
    </div>
  </div>

  <div class="bottom-bar">
    <button id="tabBtnHome" class="active" type="button" onclick="showTab('home')">Главная</button>
    <button id="tabBtnProfile" type="button" onclick="showTab('profile')">Профиль</button>
  </div>

  <script>
    // Вставь сюда свои ссылки:
    const SUPPORT_LINK = "https://t.me";
    const CHANNEL_LINK = "https://t.me";

    document.getElementById("supportUrlBtn").href = SUPPORT_LINK;
    document.getElementById("channelUrlBtn").href = CHANNEL_LINK;

    let optDigits = true;
    let optUnder = false;
    let optNoAt = false;
    let genMode = "unique";

    const ROOTS = [
      "cyber", "neon", "void", "flux", "nova", "drift", "zen", "apex",
      "kuro", "lux", "vibe", "echo", "orbit", "pixel", "storm", "frost",
      "shadow", "pulse", "atlas", "hyper", "lunar", "solar", "rift", "byte"
    ];

    let favs = JSON.parse(localStorage.getItem("nicup_fav_simple") || "[]");
    let hist = JSON.parse(localStorage.getItem("nicup_hist_simple") || "[]");

    try {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
        const u = window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user;
        if (u) {
          const name = [u.first_name, u.last_name].filter(Boolean).join(" ") || "Пользователь";
          const letter = name.charAt(0).toUpperCase() || "N";
          document.getElementById("profName").textContent = name;
          document.getElementById("profUser").textContent = u.username ? "@" + u.username : "Без ника";
          document.getElementById("profId").textContent = String(u.id || "—");
          document.getElementById("topAvaBtn").textContent = letter;
          document.getElementById("profAva").textContent = letter;
          if (u.photo_url) {
            document.getElementById("topAvaBtn").innerHTML = '<img src="' + u.photo_url + '" alt="">';
            document.getElementById("profAva").innerHTML = '<img src="' + u.photo_url + '" alt="">';
          }
        }
      }
    } catch (e) {}

    function showTab(tab) {
      document.getElementById("pane-home").classList.toggle("show", tab === "home");
      document.getElementById("pane-profile").classList.toggle("show", tab === "profile");
      document.getElementById("tabBtnHome").classList.toggle("active", tab === "home");
      document.getElementById("tabBtnProfile").classList.toggle("active", tab === "profile");
      if (tab === "profile") {
        renderSaved();
      }
    }

    function toggleOpt(name) {
      if (name === "digits") {
        optDigits = !optDigits;
        document.getElementById("btnDigits").classList.toggle("active", optDigits);
      } else if (name === "under") {
        optUnder = !optUnder;
        document.getElementById("btnUnder").classList.toggle("active", optUnder);
      } else if (name === "noAt") {
        optNoAt = !optNoAt;
        document.getElementById("btnNoAt").classList.toggle("active", optNoAt);
      }
    }

    function setMode(mode) {
      genMode = mode;
      document.getElementById("btnModeUnique").classList.toggle("active", mode === "unique");
      document.getElementById("btnModeRandom").classList.toggle("active", mode === "random");
      document.getElementById("msgBox").textContent = "Режим: " + (mode === "unique" ? "Уникальные" : "Случайные") + ". Нажми «Сгенерировать»";
    }

    function getExcl() {
      const parts = (document.getElementById("exclInput").value || "")
        .toLowerCase()
        .split(/[\s,;]+/)
        .map(s => s.replace(/[^a-z0-9_]/g, ""))
        .filter(Boolean);
      return {
        chars: new Set(parts.filter(p => p.length === 1)),
        words: parts.filter(p => p.length > 1)
      };
    }

    function allowedStr(str, chars) {
      return str.split("").filter(ch => !chars.has(ch)).join("");
    }

    function okNick(plain, ex) {
      for (const ch of plain) {
        if (ex.chars.has(ch)) return false;
      }
      for (const w of ex.words) {
        if (plain.includes(w)) return false;
      }
      return true;
    }

    function makeOne(len, kwRaw, ex) {
      const letters = allowedStr("abcdefghijklmnopqrstuvwxyz", ex.chars) || "abcdefg";
      const digits = allowedStr("0123456789", ex.chars);
      const canUnder = optUnder && !ex.chars.has("_");
      let kw = allowedStr((kwRaw || "").toLowerCase().replace(/[^a-z0-9_]/g, ""), ex.chars);
      if (kw && !/^[a-z]/.test(kw)) kw = letters[0] + kw;

      let out = "";
      if (genMode === "unique") {
        const pool = ROOTS.filter(w => okNick(w, ex));
        const words = pool.length ? pool : [letters.slice(0, 4) || "user"];
        const a = kw || words[Math.floor(Math.random() * words.length)];
        const b = words[Math.floor(Math.random() * words.length)];
        out = canUnder && Math.random() < 0.5 ? (a + "_" + b) : (a + b);
        if (optDigits && digits.length && out.length < len) {
          out += digits[Math.floor(Math.random() * digits.length)];
        }
        while (out.length < len) {
          out += letters[Math.floor(Math.random() * letters.length)];
        }
      } else {
        const vowels = allowedStr("aeiouy", ex.chars) || "aeo";
        const cons = allowedStr("bcdfghjklmnpqrstvwxz", ex.chars) || "kmnrst";
        out = kw.slice(0, len);
        while (out.length < len) {
          const prev = out[out.length - 1] || "";
          if (canUnder && out.length > 1 && out.length < len - 1 && prev !== "_" && Math.random() < 0.18) {
            out += "_";
          } else if (optDigits && digits.length && out.length >= len - 2 && Math.random() < 0.4) {
            out += digits[Math.floor(Math.random() * digits.length)];
          } else {
            const set = vowels.includes(prev) ? cons : vowels;
            out += set[Math.floor(Math.random() * set.length)];
          }
        }
      }

      out = out.slice(0, len).replace(/^_+|_+$/g, "");
      if (!out || !/^[a-z]/.test(out)) {
        out = letters[0] + out.slice(1);
      }
      return "@" + out;
    }

    function generateTen() {
      const len = Number(document.getElementById("lenInput").value) || 7;
      const kw = document.getElementById("wordInput").value.trim();
      const ex = getExcl();
      const list = [];
      const used = new Set();
      let guard = 0;

      while (list.length < 10 && guard < 400) {
        const nick = makeOne(len, kw, ex);
        if (!used.has(nick) && okNick(nick.slice(1), ex)) {
          used.add(nick);
          list.push(nick);
        }
        guard++;
      }

      const letters = allowedStr("abcdefghijklmnopqrstuvwxyz", ex.chars) || "abcdefg";
      while (list.length < 10) {
        let s = "";
        for (let i = 0; i < len; i++) s += letters[Math.floor(Math.random() * letters.length)];
        const nick = "@" + s;
        if (!used.has(nick)) {
          used.add(nick);
          list.push(nick);
        }
      }

      list.forEach(n => {
        hist = [n].concat(hist.filter(x => x !== n)).slice(0, 30);
      });
      localStorage.setItem("nicup_hist_simple", JSON.stringify(hist));

      const box = document.getElementById("listBox");
      box.style.display = "block";
      box.innerHTML = "";

      list.forEach(nick => {
        const row = document.createElement("div");
        row.className = "nick-item";

        const checkBtn = document.createElement("button");
        checkBtn.type = "button";
        checkBtn.className = "nick-check";
        checkBtn.innerHTML = nick + '<span class="nick-tag">[проверить]</span>';
        checkBtn.onclick = function () {
          const tag = checkBtn.querySelector(".nick-tag");
          tag.textContent = "[...]";
          fetch("https://t.me/" + nick.slice(1), { mode: "no-cors" })
            .then(() => {
              tag.textContent = "[t.me ок]";
              document.getElementById("msgBox").textContent = "Проверено: https://t.me/" + nick.slice(1);
            })
            .catch(() => {
              tag.textContent = "[нет отклика]";
              document.getElementById("msgBox").textContent = "Нет отклика от t.me/" + nick.slice(1);
            });
        };

        const heartBtn = document.createElement("button");
        heartBtn.type = "button";
        heartBtn.className = "heart-btn" + (favs.includes(nick) ? " on" : "");
        heartBtn.textContent = "♥";
        heartBtn.onclick = function () {
          if (favs.includes(nick)) {
            favs = favs.filter(x => x !== nick);
            heartBtn.classList.remove("on");
          } else {
            favs.unshift(nick);
            heartBtn.classList.add("on");
          }
          localStorage.setItem("nicup_fav_simple", JSON.stringify(favs));
        };

        const copyBtn = document.createElement("button");
        copyBtn.type = "button";
        copyBtn.className = "mini-btn";
        copyBtn.textContent = "Копировать";
        copyBtn.onclick = function () {
          copyVal(nick, copyBtn);
        };

        row.appendChild(checkBtn);
        row.appendChild(heartBtn);
        row.appendChild(copyBtn);
        box.appendChild(row);
      });

      document.getElementById("msgBox").textContent = "Готово: 10 вариантов";
    }

    function copyVal(nick, btn) {
      const val = optNoAt ? nick.slice(1) : nick;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(val).catch(() => {});
      }
      document.getElementById("msgBox").textContent = "Скопировано: " + val;
      if (btn) {
        btn.textContent = "Ок";
        setTimeout(() => { btn.textContent = "Копировать"; }, 900);
      }
    }

    function toggleFavSimple(nick) {
      if (favs.includes(nick)) favs = favs.filter(x => x !== nick);
      else favs.unshift(nick);
      localStorage.setItem("nicup_fav_simple", JSON.stringify(favs));
      renderSaved();
    }

    function clearFavs() {
      favs = [];
      localStorage.setItem("nicup_fav_simple", "[]");
      renderSaved();
    }

    function clearHist() {
      hist = [];
      localStorage.setItem("nicup_hist_simple", "[]");
      renderSaved();
    }

    function renderSaved() {
      const favBox = document.getElementById("favBox");
      if (!favs.length) {
        favBox.innerHTML = '<div style="font-size:12px;color:#94a3b8;">Пусто</div>';
      } else {
        favBox.innerHTML = "";
        favs.forEach(nick => {
          const r = document.createElement("div");
          r.className = "saved-row";
          r.innerHTML = '<strong>' + nick + '</strong><div style="display:flex;gap:6px;"><button class="mini-btn" type="button">Копировать</button><button class="heart-btn on" type="button">♥</button></div>';
          r.querySelectorAll("button")[0].onclick = function () { copyVal(nick, this); };
          r.querySelectorAll("button")[1].onclick = function () { toggleFavSimple(nick); };
          favBox.appendChild(r);
        });
      }

      const histBox = document.getElementById("histBox");
      if (!hist.length) {
        histBox.innerHTML = '<div style="font-size:12px;color:#94a3b8;">Пусто</div>';
      } else {
        histBox.innerHTML = "";
        hist.forEach(nick => {
          const r = document.createElement("div");
          r.className = "saved-row";
          r.innerHTML = '<span>' + nick + '</span><button class="mini-btn" type="button">Копировать</button>';
          r.querySelector("button").onclick = function () { copyVal(nick, this); };
          histBox.appendChild(r);
        });
      }
    }

    // Статистика JSONBin.io и ad.json
    (function () {
      const BIN_ID = "6b0938883957a11c13b6397b";
      const API_KEY = "$2a$10$nbho.No3FFfEiqFA5FQcwuYL/kMVR1KOPuHPv0vsFdgk9eEiLbAVa";
      const BIN_URL = "https://api.jsonbin.io/v3/b/" + BIN_ID;

      function dayStr() {
        const d = new Date();
        return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      }

      function uidStr() {
        try {
          const u = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user;
          if (u && u.id) return String(u.id);
        } catch (e) {}
        let id = localStorage.getItem("nicup_uid_simple");
        if (!id) {
          id = "u_" + Math.random().toString(36).slice(2, 9);
          localStorage.setItem("nicup_uid_simple", id);
        }
        return id;
      }

      function saveStat(incAd) {
        fetch(BIN_URL + "/latest?t=" + Date.now(), {
          cache: "no-store",
          headers: { "X-Master-Key": API_KEY }
        })
          .then(r => r.ok ? r.json() : null)
          .then(body => {
            const rec = (body && body.record && typeof body.record === "object") ? body.record : (body || {});
            const data = {
              users: (rec.users && typeof rec.users === "object") ? rec.users : {},
              days: (rec.days && typeof rec.days === "object") ? rec.days : {},
              ad_clicks: typeof rec.ad_clicks === "number" ? rec.ad_clicks : 0
            };
            const uid = uidStr();
            const day = dayStr();
            if (!data.users[uid]) data.users[uid] = { first_seen: day, last_seen: day };
            else data.users[uid].last_seen = day;
            if (!data.days[day]) data.days[day] = { new_users: 0, active_users: [] };
            if (!Array.isArray(data.days[day].active_users)) data.days[day].active_users = [];
            if (!data.days[day].active_users.includes(uid)) data.days[day].active_users.push(uid);
            if (incAd) data.ad_clicks += 1;

            return fetch(BIN_URL, {
              method: "PUT",
              headers: {
                "Content-Type": "application/json",
                "X-Master-Key": API_KEY
              },
              body: JSON.stringify(data)
            });
          })
          .catch(() => {});
      }

      saveStat(false);

      fetch("./ad.json?t=" + Date.now(), { cache: "no-store" })
        .then(r => r.json())
        .then(cfg => {
          const adEl = document.getElementById("adLink");
          if (!adEl || !cfg) return;
          if (cfg.enabled === false) {
            adEl.style.display = "none";
            return;
          }
          if (cfg.title) document.getElementById("adTitle").textContent = cfg.title;
          if (cfg.desc) document.getElementById("adDesc").textContent = cfg.desc;
          if (cfg.url) adEl.href = cfg.url;
          adEl.addEventListener("click", () => saveStat(true));
        })
        .catch(() => {});
    })();
  </script>
</body>
</html>
