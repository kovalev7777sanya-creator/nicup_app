<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Генератор юзернеймов</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-page: #f2f2f7;
      --bg-card: #ffffff;
      --bg-fill: #e5e5ea;
      --text-main: #000000;
      --text-sec: #6e6e73;
      --separator: rgba(60, 60, 67, 0.14);
      --ios-blue: #007aff;
      --ios-blue-active: #005ecb;
      --ios-green: #34c759;
      --ios-orange: #ff9500;
      --ios-red: #ff3b30;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-page: #000000;
        --bg-card: #1c1c1e;
        --bg-fill: #2c2c2e;
        --text-main: #ffffff;
        --text-sec: #98989d;
        --separator: rgba(84, 84, 88, 0.36);
        --ios-blue: #0a84ff;
        --ios-blue-active: #0066cc;
        --ios-green: #30d158;
        --ios-orange: #ff9f0a;
        --ios-red: #ff453a;
      }
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 16px 16px 36px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    .header {
      margin-bottom: 14px;
      padding: 0 4px;
    }

    .title {
      margin: 0;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .subtitle {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--text-sec);
    }

    .section-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--text-sec);
      margin: 0 0 7px 6px;
    }

    .card {
      background-color: var(--bg-card);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 16px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .seg-control {
      display: grid;
      gap: 4px;
      background-color: var(--bg-fill);
      padding: 3px;
      border-radius: 10px;
    }

    .seg-modes {
      grid-template-columns: 1fr 1fr;
    }

    .seg-counts {
      grid-template-columns: repeat(4, 1fr);
    }

    .seg-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--text-main);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 6px;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }

    .seg-btn:active {
      transform: scale(0.96);
    }

    .seg-btn.active {
      background-color: var(--bg-card);
      color: var(--text-main);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
    }

    .input-wrap {
      margin-top: 12px;
    }

    .ios-input {
      width: 100%;
      appearance: none;
      border: 1px solid var(--separator);
      background-color: var(--bg-fill);
      color: var(--text-main);
      font-family: inherit;
      font-size: 15px;
      padding: 11px 13px;
      border-radius: 11px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .ios-input::placeholder {
      color: var(--text-sec);
    }

    .ios-input:focus {
      border-color: var(--ios-blue);
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-top: 12px;
    }

    .main-btn {
      appearance: none;
      border: none;
      background-color: var(--ios-blue);
      color: #ffffff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      padding: 12px 14px;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.15s ease;
    }

    .main-btn:active {
      transform: scale(0.97);
      background-color: var(--ios-blue-active);
    }

    .ghost-btn {
      appearance: none;
      border: none;
      background-color: var(--bg-fill);
      color: var(--ios-blue);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 12px 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.15s ease;
    }

      transform: scale(0.9
