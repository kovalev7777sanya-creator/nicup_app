<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Генератор юзернеймов</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      margin: 0;
      padding: 16px;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 20px;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }
    input, select, button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      box-sizing: border-box;
    }
    input, select {
      border: 1px solid rgba(128, 128, 128, 0.35);
      background-color: var(--tg-theme-secondary-bg-color, #f2f3f5);
      color: var(--tg-theme-text-color, #000000);
    }
    button.main-btn {
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-radius: 10px;
      background-color: var(--tg-theme-secondary-bg-color, #f2f3f5);
    }
    .nick {
      font-weight: 500;
      user-select: all;
    }
    .copy-btn {
      width: auto;
      padding: 6px 12px;
      font-size: 13px;
      border: none;
      border-radius: 8px;
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Генератор 10 юзернеймов</h2>

  <div class="controls">
    <input id="word" type="text" placeholder="Слово для основы (необязательно, например: max)" />
    <select id="mode">
      <option value="mixed">Смешанный стиль</option>
      <option value="short">Короткие и чистые</option>
      <option value="brand">Под проект / канал</option>
    </select>
    <button class="main-btn" id="genBtn">Сгенерировать 10</button>
  </div>

  <div class="list" id="resultList"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const prefixes = ["pro", "mr", "the", "its", "real", "hey", "neo", "top", "go", "my"];
    const suffixes = ["hub", "lab", "dev", "ly", "io", "one", "max", "way", "drop", "box"];
    const chars = "abcdefghijklmnopqrstuvwxyz";

    function randStr(len) {
      let out = "";
      for (let i = 0; i < len; i++) {
        out += chars[Math.floor(Math.random() * chars.length)];
      }
      return out;
    }

    function buildUsername(baseWord, mode) {
      const clean = baseWord.toLowerCase().replace(/[^a-z0-9_]/g, "");
      const p = prefixes[Math.floor(Math.random() * prefixes.length)];
      const s = suffixes[Math.floor(Math.random() * suffixes.length)];
      const num = Math.floor(10 + Math.random() * 899);

      if (clean.length >= 2) {
        const templates = [
          `${clean}_${s}`,
          `${p}_${clean}`,
          `${clean}${randStr(2)}`,
          `${clean}_${num}`,
          `${p}${clean}`
        ];
        return templates[Math.floor(Math.random() * templates.length)];
      }

      if (mode === "short") return `${randStr(4)}_${randStr(3)}`;
      if (mode === "brand") return `${randStr(5)}${s}`;
      return `${p}_${randStr(4)}${Math.floor(10 + Math.random() * 89)}`;
    }

    function generateTen() {
      const baseWord = document.getElementById("word").value.trim();
      const mode = document.getElementById("mode").value;
      const list = document.getElementById("resultList");
      list.innerHTML = "";

      const set = new Set();
      let guard = 0;

      while (set.size < 10 && guard < 100) {
        guard++;
        const candidate = buildUsername(baseWord, mode);
        if (candidate.length >= 5 && candidate.length <= 32) {
          set.add(candidate);
        }
      }

      set.forEach((nick) => {
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = `
          <span class="nick">@${nick}</span>
          <button class="copy-btn">Копировать</button>
        `;
        row.querySelector("button").addEventListener("click", () => {
          navigator.clipboard.writeText("@" + nick);
          tg.showPopup({
            title: "Скопировано",
            message: `@${nick} в буфере обмена`,
            buttons: [{ type: "ok" }]
          });
        });
        list.appendChild(row);
      });
    }

    document.getElementById("genBtn").addEventListener("click", generateTen);
    generateTen();
  </script>
</body>
</html>
